<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="IS2ZAJvtsz61lijmLSYBxcPXJrJ0bQI4BeRA3YsN5HY" />
    <title>Document</title>

    <style>
        body {
            margin: 0;
            font-family: "Baloo 2", sans-serif;
            background:
                linear-gradient(rgba(0, 0, 0, .55), rgba(0, 0, 0, .55)),
                url("home.jpeg") no-repeat center center/cover;
        }

        /* ================= HEADER ================= */

        header {
            background: rgba(8, 15, 35, 0.85);
            backdrop-filter: blur(12px);
            padding: 18px 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Navigation */

        nav {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Navigation Links */

        nav ul {
            display: flex;
            list-style: none;
            gap: 35px;
            margin: 0;
            padding: 0;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            transition: .3s;
        }

        nav a:hover {
            color: #00D9FF;
        }

        /* Logo */

        .logo {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
        }

        .logo img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #00D9FF;
            cursor: pointer;
            transition: .4s ease;
        }

        .logo img:hover {
            transform: scale(1.12) rotate(360deg);
            box-shadow: 0 0 18px #00D9FF;
        }

        .content-1 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100vh;
            width: 100%;
        }

        h1 {
            color: white;
            font-size: 3.5rem;
            text-shadow: 0 0 20px rgba(0, 0, 0, .8);
        }

        p {
            color: #d8e6ff;
            font-size: 1.2rem;
        }

        .button {
            background: #00BFFF;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin: 10px;
            transition: .3s;
        }

        .button:hover {
            background: #0099cc;
            transform: translateY(-3px);
        }

        /* ================= FOOTER ================= */

        footer {
            background: #081326;
            color: white;
            text-align: center;
            padding: 20px;
        }

        footer a {
            color: #00D9FF;
            text-decoration: none;
        }

        footer a:hover {
            color: white;
        }
    </style>

</head>

<body>

    <header>

        <nav>

            <!-- Navigation Links -->
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <!-- Logo on Right -->
            <div class="logo">
                <img src="logo.png" alt="Logo">
            </div>

        </nav>

    </header>

    <div class="content-1">
        <h1>Hello Muhammad Mujtaba here</h1>

        <p>
            This is a complete site with navigation and multiple pages.
            Click below to learn about this site.
        </p>

        <a href="about.html" class="button">Learn More</a>
        <a href="contact.html" class="button">Get in Touch</a>

    </div>

    <footer>

        <h3>Let's Connect</h3>

        <h4 style="color:#00D9FF;">
            Email Me: mujtabaproo11@gmail.com
        </h4>

        <a href="https://instagram.com/mujtabx.__">Social Media</a>

        <br><br>

        &copy; 2026 Muhammad Mujtaba. Built with HTML.

    </footer>

</body>

</html>
