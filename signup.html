<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Portfolio</title>
    <style>
        body {
            margin: 0;
            font-family: "Baloo 2", sans-serif;
            background:
                linear-gradient(rgba(0, 0, 0, .65), rgba(0, 0, 0, .65)),
                url("signup.jpg") no-repeat center center/cover fixed;
            color: white;
            overflow-x: hidden;
        }

        header {
            background: rgba(8, 15, 35, 0.85);
            backdrop-filter: blur(12px);
            padding: 18px 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 35px;
            margin: 0;
            padding: 0;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            transition: .3s;
        }

        nav a:hover {
            color: #00D9FF;
        }

        .button {
            background: #00BFFF;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin: 10px 0;
            display: inline-block;
            transition: .3s;
            box-sizing: border-box;
        }

        .button:hover {
            background: #0099cc;
            box-shadow: 5px 5px 15px rgba(25, 220, 255, 0.5);
        }

        .logo {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
        }

        .logo img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #00D9FF;
            cursor: pointer;
            transition: .4s ease;
        }

        .logo img:hover {
            transform: translateY(-4.5px);
            box-shadow: 0 0 18px #00D9FF;
        }

        /* Pure CSS Mobile Drawer Setup */
        .menu-toggle,
        .menu-btn {
            display: none;
        }

        .drawer-overlay {
            display: none;
        }

        /* Signup Form Styling */
        .signup-container {
            width: 420px;
            max-width: 90%;
            margin: 60px auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
            box-sizing: border-box;
        }

        .signup-container h1 {
            text-align: center;
            margin-bottom: 10px;
            color: white;
        }

        .signup-container p {
            text-align: center;
            color: #d8e6ff;
            margin-bottom: 30px;
        }

        .signup-container label {
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
            color: white;
        }

        .signup-container input,
        .signup-container select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            background: rgba(255, 255, 255, .12);
            color: white;
            box-sizing: border-box;
        }

        .signup-container input::placeholder {
            color: #cccccc;
        }

        .signup-container select {
            cursor: pointer;
        }

        .signup-container option {
            color: black;
        }

        .signup-container .button {
            width: 100%;
            border: none;
            cursor: pointer;
            margin-top: 30px;
            font-size: 17px;
        }

        footer {
            background: #081326;
            color: white;
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid rgba(0, 217, 255, 0.2);
        }

        footer a {
            color: #00D9FF;
            text-decoration: none;
        }

        footer a:hover {
            color: white;
        }

        /* --- MOBILE RESPONSIVENESS & DRAWER MENU --- */
        @media (max-width: 820px) {
            header {
                padding: 12px 20px;
            }

            nav {
                justify-content: space-between;
            }

            /* Show Hamburger Button */
            .menu-btn {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                width: 30px;
                height: 22px;
                cursor: pointer;
                z-index: 1002;
            }

            .menu-btn span {
                height: 3px;
                width: 100%;
                background-color: #00D9FF;
                border-radius: 3px;
                transition: transform 0.3s ease, opacity 0.3s ease;
            }

            /* Mobile Drawer Navigation */
            nav ul {
                position: fixed;
                top: 0;
                left: -280px; /* Hidden off-screen by default */
                width: 260px;
                height: 100vh;
                background: rgba(8, 15, 35, 0.96);
                backdrop-filter: blur(15px);
                border-right: 1px solid rgba(0, 217, 255, 0.3);
                flex-direction: column;
                justify-content: flex-start;
                padding: 90px 30px 30px 30px;
                gap: 25px;
                transition: left 0.3s ease;
                z-index: 1001;
            }

            nav ul li a {
                font-size: 20px;
                display: block;
            }

            /* Clickable Dark Overlay Behind Open Drawer */
            .drawer-overlay {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.6);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
                z-index: 1000;
            }

            /* Open Drawer when Checkbox is Checked */
            .menu-toggle:checked ~ ul {
                left: 0;
            }

            .menu-toggle:checked ~ .drawer-overlay {
                opacity: 1;
                pointer-events: auto;
            }

            /* Animate Hamburger into an "X" when open */
            .menu-toggle:checked ~ .menu-btn span:nth-child(1) {
                transform: translateY(9.5px) rotate(45deg);
            }

            .menu-toggle:checked ~ .menu-btn span:nth-child(2) {
                opacity: 0;
            }

            .menu-toggle:checked ~ .menu-btn span:nth-child(3) {
                transform: translateY(-9.5px) rotate(-45deg);
            }

            /* Reposition Logo on Mobile */
            .logo {
                position: relative;
                top: 0;
                transform: none;
            }

            .logo img {
                width: 50px;
                height: 50px;
            }

            /* Form Tweaks for Smaller Displays */
            .signup-container {
                margin: 30px auto;
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <!-- Checkbox trigger for CSS drawer -->
            <input type="checkbox" id="menu-toggle" class="menu-toggle">

            <!-- Hamburger Button -->
            <label for="menu-toggle" class="menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <!-- Mobile Drawer Navigation -->
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="index.html#projects">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>

            <!-- Dark Overlay -->
            <label for="menu-toggle" class="drawer-overlay"></label>

            <div class="logo">
                <img src="logo.png" alt="Logo">
            </div>
        </nav>
    </header>

    <div class="signup-container">
        <h1>SIGN UP</h1>
        <p>Fill in your details below.</p>

        <form>
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>

            <label>Father's Name</label>
            <input type="text" placeholder="Enter your father's name" required>

            <label>Gender</label>
            <select required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label>Email:</label>
            <input type="email" placeholder="example@gmail.com" required>

            <label>Birth Date</label>
            <input type="date" required>

            <button onclick="alert('Your Details Have been Submitted')" type="submit" class="button">Sign Up</button>
        </form>
    </div>

    <footer>
        <h3>Let's Connect</h3>
        <h4 style="color:#00D9FF;">
            Email Me: mujtabaproo11@gmail.com
        </h4>
        <a href="https://instagram.com/mujtabx.__" target="_blank">Social Media</a>
        <br><br>
        &copy; 2026 Muhammad Mujtaba. Built with HTML & CSS.
    </footer>

</body>

</html>
